[package]
name = "ores-runtime-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Modular Axum lifecycle and ores.lru-redis.v1 runtime configuration for ORE servers"
repository = "https://github.com/zed-pkg/zed-pkg.github.io"
publish = false

[dependencies]
axum = "0.8.4"
flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "6ea0619356edab096b94b7209a3d569db9e27110" }
ores-lru-redis = { path = "../.." }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "allow"
nursery = "allow"
