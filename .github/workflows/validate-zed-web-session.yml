name: validate matching Rust session contract

on:
  push:
    branches:
      - agent/marketing-auth-header-20260810
    paths:
      - .github/workflows/validate-zed-web-session.yml

permissions:
  contents: read

concurrency:
  group: validate-zed-web-session
  cancel-in-progress: true

env:
  ZED_WEB_SHA: 9e90774eb85d47355de2f25020e4689d6e964618
  ZED_INTERFACES_SHA: 5394b2e7b070354ee79a4c6ac79c26d6264970cd

jobs:
  rust-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-web-server.rs
          ref: ${{ env.ZED_WEB_SHA }}
          path: zed-web-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false
      - name: Verify immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-web-server.rs rev-parse HEAD)" = "$ZED_WEB_SHA"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Verify format
        working-directory: zed-web-server.rs
        run: cargo fmt --all -- --check
      - name: Check all targets
        working-directory: zed-web-server.rs
        run: cargo check --locked --all-targets
      - name: Strict Clippy
        working-directory: zed-web-server.rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        working-directory: zed-web-server.rs
        run: cargo test --locked
