name: runtime-server distribution

on:
  push:
    branches:
      - "dist/ores-runtime-server-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-server-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install Rust 1.85.1
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup default 1.85.1
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build release
        run: cargo build --workspace --release --all-features
