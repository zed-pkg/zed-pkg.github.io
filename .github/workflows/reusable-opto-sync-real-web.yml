name: reusable opto-sync real web e2e

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: reusable-opto-sync-real-web-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.56.0
  WEB_HARNESS_SHA: fd80220cfe8b9d553959bb621419491ee9167c11

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout caller application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: app
          persist-credentials: false

      - name: Checkout reviewed browser harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-pkg.github.io
          ref: ${{ env.WEB_HARNESS_SHA }}
          path: .tools/opto-web-smoke
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.1'

      - name: Run repository tests and production build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
          fi

      - name: Locate browser shell
        id: shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          base = pathlib.Path('app')
          for root in (base / 'dist', base / 'build', base / 'out', base / 'public', base):
              if not root.is_dir():
                  continue
              for page in ('index.html', 'popup.html', 'options.html'):
                  if (root / page).is_file():
                      mode = 'extension' if (root / 'manifest.json').is_file() else 'http'
                      print('root=' + str(root.resolve()))
                      print('page=' + page)
                      print('mode=' + mode)
                      raise SystemExit(0)
          raise SystemExit('no index.html, popup.html, or options.html found after build')
          PY

      - name: Install pinned Chromium and Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opto-browser"
          cd "$RUNNER_TEMP/opto-browser"
          npm init -y >/dev/null
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Exercise rendered shell, IndexedDB durability, reload, and offline cache
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/opto-browser/node_modules/playwright
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/.tools/opto-web-smoke/tests/e2e/opto_sync_real_web_smoke.cjs"
          if [[ "${{ steps.shell.outputs.mode }}" == extension ]]; then
            APP_MODE=extension APP_ROOT="${{ steps.shell.outputs.root }}" APP_PAGE="${{ steps.shell.outputs.page }}" \
              xvfb-run -a node "$harness"
          else
            python3 -m http.server 4173 --bind 127.0.0.1 --directory "${{ steps.shell.outputs.root }}" >"$RUNNER_TEMP/opto-http.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:4173/${{ steps.shell.outputs.page }}" >/dev/null && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:4173/${{ steps.shell.outputs.page }}" >/dev/null
            APP_MODE=http APP_URL="http://127.0.0.1:4173/${{ steps.shell.outputs.page }}" node "$harness"
          fi
