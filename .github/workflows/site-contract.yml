name: public site contract

on:
  pull_request:
    paths:
      - ".github/workflows/site-contract.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-contract.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "29 7 * * *"

permissions:
  contents: read

concurrency:
  group: public-site-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Build the locked Astro production site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify generated marketing routes and metadata
        run: python3 tests/marketing_pages_contract.py

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-site-contract
          .venv-site-contract/bin/python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            playwright==1.55.0
          .venv-site-contract/bin/python -m playwright install --with-deps chromium

      - name: Verify portfolio claims and browser behavior
        run: .venv-site-contract/bin/python tests/site_contract.py

      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site-contract-failure
          path: build/site-contract-results
          if-no-files-found: ignore
          retention-days: 7
