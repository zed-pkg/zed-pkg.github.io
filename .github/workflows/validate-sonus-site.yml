name: validate immutable Sonus marketing contract

on:
  push:
    branches:
      - agent/marketing-auth-header-20260810
    paths:
      - .github/workflows/validate-sonus-site.yml

permissions:
  contents: read

concurrency:
  group: validate-sonus-site
  cancel-in-progress: true

env:
  SONUS_SITE_SHA: 93e0a826d1365f39b6cf1508db2a90baee8ccf04

jobs:
  marketing-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sonus-auris/sonus-auris-site.web
          ref: ${{ env.SONUS_SITE_SHA }}
          persist-credentials: false
      - name: Verify immutable site input
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SONUS_SITE_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Run build and static contract suite
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser contract suite
        run: npm run test:e2e
