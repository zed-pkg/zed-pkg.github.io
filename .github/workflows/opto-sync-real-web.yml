name: opto-sync real web application e2e

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/opto-sync-real-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-web:
    uses: opto-sync/opto-sync-e2e/.github/workflows/real-web-app-reusable.yml@c8e03dda14251be2125afb01cfa2e219152d4c15
    with:
      mock_api_origin: https://app.zpkg.net
