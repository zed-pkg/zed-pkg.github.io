[package]
name = "ores-websocket"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Shared ORES WebSocket protocol and Axum runtime primitives"

[features]
default = []
axum = ["dep:axum", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
axum = { version = "0.8", optional = true, features = ["ws"] }
tokio = { version = "1", optional = true, features = ["time"] }

[lints.rust]
unsafe_code = "forbid"
